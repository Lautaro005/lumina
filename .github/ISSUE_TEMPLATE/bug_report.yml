name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems go to the Security tab (Report a vulnerability), never here."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Lumina version and OS
      placeholder: "0.2.0 · macOS 27 (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lumina doctor`
      render: text
