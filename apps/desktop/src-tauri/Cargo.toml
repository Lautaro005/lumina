[package]
name = "lumina-desktop"
description = "Lumina desktop app: a window and tray icon around the local Lumina server"
version = "0.1.5"
edition = "2021"
license-file = "../../../LICENSE"
repository = "https://github.com/Lautaro005/lumina"
publish = false

[lib]
name = "lumina_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumina-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
ureq = { version = "2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
