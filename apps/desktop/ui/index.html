<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumina</title>
<style>
  :root { --desk:#e7ecf5; --paper:#fff; --ink:#1e2430; --ink2:#4a5568; --rule:#3a6fd8; --margin:#d9453b; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --desk:#0d121c; --paper:#151b27; --ink:#e6eaf2; --ink2:#b0b9cb; --rule:#6f9bff; --margin:#ff6b5e; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--desk); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; }
  .sheet { background: var(--paper); width: min(520px, 90vw); border-radius: 6px; box-shadow: 0 8px 28px rgba(25,38,70,.12); display: grid; grid-template-columns: 34% 1fr; position: relative; overflow: hidden; }
  .sheet::before { content: ""; position: absolute; left: 34%; top: 0; bottom: 0; width: 2px; background: var(--margin); animation: flow 1.6s ease-in-out infinite; }
  @keyframes flow { 50% { opacity: .35; } }
  .head { grid-column: 1 / -1; padding: 18px 22px 12px; border-bottom: 2px solid var(--rule); font: 600 22px Georgia, serif; display: flex; align-items: center; gap: 10px; }
  .cue { padding: 16px 18px 18px 22px; font-weight: 700; font-size: 13.5px; }
  .body { padding: 16px 22px 18px; color: var(--ink2); }
  .error .sheet::before { animation: none; }
  code { font: 13px ui-monospace, Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { .sheet::before { animation: none; } }
</style>
</head>
<body>
  <div class="sheet" role="status" aria-live="polite">
    <div class="head">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="2" width="26" height="28" rx="3" fill="#2b4fa8"/><rect x="5" y="4" width="22" height="24" rx="2" fill="#fff"/><rect x="5" y="10" width="22" height="2" fill="#3a6fd8"/><rect x="12" y="12" width="2" height="16" fill="#d9453b"/></svg>
      lumina
    </div>
    <div class="cue" id="cue">Starting</div>
    <div class="body" id="msg">Opening your notes on this computer…</div>
  </div>
<script>
  function show() {
    var m = /error=([^&]*)/.exec(location.hash);
    if (m) {
      document.body.className = "error";
      document.getElementById("cue").textContent = "Could not start";
      document.getElementById("msg").textContent = decodeURIComponent(m[1]);
    }
  }
  window.addEventListener("hashchange", show); show();
</script>
</body>
</html>
