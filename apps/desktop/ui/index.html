<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumina</title>
<style>
  :root { --desk:#f7f8fa; --paper:#fff; --ink:#1d2129; --ink2:#4b5563; --rule:#e3e7ee; --accent:#7b9be0; --margin:#e0594f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --desk:#0f1115; --paper:#171a20; --ink:#e8eaee; --ink2:#b4bac6; --rule:#2a2f3a; --accent:#8ba6e6; --margin:#ff7468; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--desk); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; }
  .sheet { background: var(--paper); width: min(520px, 90vw); border-radius: 12px; box-shadow: 0 0 0 1px var(--rule), 0 8px 28px rgba(20,28,45,.07); display: grid; grid-template-columns: 34% 1fr; position: relative; overflow: hidden; }
  .sheet::before { content: ""; position: absolute; left: 34%; top: 0; bottom: 0; width: 1px; background: var(--margin); opacity: .6; animation: flow 1.6s ease-in-out infinite; }
  @keyframes flow { 50% { opacity: .2; } }
  .head { grid-column: 1 / -1; padding: 18px 22px 12px; border-bottom: 1px solid var(--rule); font: 600 22px Georgia, serif; display: flex; align-items: center; gap: 10px; }
  .cue { padding: 16px 18px 18px 22px; font-weight: 700; font-size: 13.5px; }
  .body { padding: 16px 22px 18px; color: var(--ink2); }
  .error .sheet::before { animation: none; opacity: .9; }
  code { font: 13px ui-monospace, Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { .sheet::before { animation: none; } }
</style>
</head>
<body>
  <div class="sheet" role="status" aria-live="polite">
    <div class="head">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="#20242c" stroke="#fff" stroke-opacity=".16"/><g transform="translate(-1 0)"><path d="M11.5 8v14a2.5 2.5 0 0 0 2.5 2.5h7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.2" cy="10.6" r="2.5" fill="#7b9be0"/></g></svg>
      lumina
    </div>
    <div class="cue" id="cue">Starting</div>
    <div class="body" id="msg">Opening your notes on this computer…</div>
  </div>
<script>
  function show() {
    var m = /error=([^&]*)/.exec(location.hash);
    if (m) {
      document.body.className = "error";
      document.getElementById("cue").textContent = "Could not start";
      document.getElementById("msg").textContent = decodeURIComponent(m[1]);
    }
  }
  window.addEventListener("hashchange", show); show();
</script>
</body>
</html>
