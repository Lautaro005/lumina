[project]
name = "lumina"
version = "0.1.8"
description = "Local-first meeting notes and knowledge base: live transcription, enhanced notes, RAG chat and an MCP server, all on your device."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lautaro Silva Sikora" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.8",
  "numpy>=1.26",
  "sounddevice>=0.5",
  "soundcard>=0.4.3; sys_platform != 'darwin'",
  "onnxruntime>=1.20",
  "onnx-asr[hub]>=0.7",
  "faster-whisper>=1.1",
  "tokenizers>=0.20",
  "huggingface-hub>=0.26",
  "chromadb>=1.0",
  "watchdog>=5.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "mcp>=1.2",
  "python-multipart>=0.0.12",
  "kokoro-onnx>=0.4",
  "ai-edge-litert>=2.2; sys_platform != 'darwin' or platform_machine == 'arm64'",
]


[project.scripts]
lumina = "lumina.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumina"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["B008", "E741"]
